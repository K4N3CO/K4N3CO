name: Generate Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight
  workflow_dispatch: # Allows you to run it manually anytime

permissions:
  contents: write # Allows the bot to save the SVGs to your repository

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Generates the main stats card
      - name: Generate Main Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: "username=K4N3CO&show_icons=true&theme=synthwave&hide_border=true&bg_color=02080d&title_color=00f2ff&text_color=ffd700&icon_color=39ff14"

      # Generates the language card
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: "username=K4N3CO&layout=compact&theme=synthwave&hide_border=true&bg_color=02080d&title_color=00f2ff&text_color=ffd700"

      # Saves the newly generated SVGs into your repository
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add profile/stats.svg profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: hide border on main stats card"
            git push
          fi
